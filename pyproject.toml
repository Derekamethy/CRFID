[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crfid-research"
version = "2.0.0"
description = "Governed CRFID domain generalization, adaptation, portability and physical redesign"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Yangdeyi Yang"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
historical = ["h5py>=3.10", "matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
crfid = "crfid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crfid = ["py.typed"]
